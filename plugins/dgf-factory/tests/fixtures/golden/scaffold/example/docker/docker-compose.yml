# The UI reads its settings from assets/appsettings.json. Compose interpolates inline config content,
# which a bind-mounted file would not get.
configs:
  publicapi-landspublic-ui-settings:
    content: |
      {
        "apiUrl": "https://${PUBLICAPI_LANDSPUBLIC_API_HOST}",
        "dateFormat": "dd/MM/yyyy",
        "timeFormat": "HH:mm",
        "dateTimeFormat": "dd/MM/yyyy HH:mm",
        "inactivityTimeout": 3600,
        "minimumLevel": "info"
      }
  publicapi-deedspublic-ui-settings:
    content: |
      {
        "apiUrl": "https://${PUBLICAPI_DEEDSPUBLIC_API_HOST}",
        "dateFormat": "dd/MM/yyyy",
        "timeFormat": "HH:mm",
        "dateTimeFormat": "dd/MM/yyyy HH:mm",
        "inactivityTimeout": 3600,
        "minimumLevel": "info"
      }
  staffapi-landsstaff-ui-settings:
    content: |
      {
        "apiUrl": "https://${STAFFAPI_LANDSSTAFF_API_HOST}",
        "dateFormat": "dd/MM/yyyy",
        "timeFormat": "HH:mm",
        "dateTimeFormat": "dd/MM/yyyy HH:mm",
        "inactivityTimeout": 3600,
        "minimumLevel": "info"
      }
  staffapi-deedsstaff-ui-settings:
    content: |
      {
        "apiUrl": "https://${STAFFAPI_DEEDSSTAFF_API_HOST}",
        "dateFormat": "dd/MM/yyyy",
        "timeFormat": "HH:mm",
        "dateTimeFormat": "dd/MM/yyyy HH:mm",
        "inactivityTimeout": 3600,
        "minimumLevel": "info"
      }

secrets:
  nuget_token:
    environment: NUGET_FEED_TOKEN

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
